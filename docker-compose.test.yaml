name: ecorepair
services:
  ecorepair-mariadb:
    image: mariadb:11.3.2
    container_name: ecorepair-mariadb
    restart: always
    environment:
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
      MYSQL_DATABASE: aa1
      MYSQL_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: [ CMD, healthcheck.sh, --connect, --innodb_initialized ]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - network-ecorepair

  api-ecorepair:
    image: api-ecorepair
    container_name: api-ecorepair-test
    ports:
      - "8080:8080"
    depends_on:
      ecorepair-mariadb:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.application.name": "ecorepair",
        "server.port": "8080",
        "spring.jpa.hibernate.ddl-auto": "update",
        "spring.jpa.properties.hibernate.globally_quoted_identifiers": "true",
        "spring.datasource.url": "jdbc:mariadb://ecorepair-mariadb:3306/aa1",
        "spring.datasource.username": "aa1",
        "spring.datasource.password": "aa1",
        "spring.jpa.database-platform": "org.hibernate.dialect.MariaDBDialect",
        "app.jwt.secret": "EcoRepairJwtSecretKeyForClassProject2026EcoRepairJwtSecretKey",
        "app.jwt.expiration-ms": "3600000",
      }'
    networks:
      - network-ecorepair

networks:
  network-ecorepair:
    driver: bridge
