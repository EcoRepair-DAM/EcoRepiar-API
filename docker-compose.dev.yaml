version: '3.8'
services:
  mariadb:
    image: mariadb:latest
    container_name: ecorepair-mariadb
    restart: always
    environment:
      MARIADB_DATABASE: aa1
      MARIADB_USER: aa1
      MARIADB_PASSWORD: aa1
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
volumes:
  mariadb_data: